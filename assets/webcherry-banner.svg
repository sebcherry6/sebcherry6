<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">WebCherry: software engineering, backend and systems</title>
  <desc id="desc">Dark WebCherry banner with the Code Cherry logo and the WEBCHERRY wordmark.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#E33255" stop-opacity=".30"/>
      <stop offset="1" stop-color="#E33255" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E33255" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E33255" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E33255" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#101115"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect y="318" width="1200" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Left: label, wordmark, tagline -->
  <text x="76" y="92" fill="#FF5575" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4">INDEPENDENT DEVELOPER BRAND</text>
  <g transform="translate(76 122) scale(1.3)" fill="none" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="1.6"><path d="M0 0 L11 40 L23 12 L35 40 L46 0" transform="translate(0 0)" stroke="#E8E9EF"/><path d="M26 0 H0 V40 H26 M0 20 H21" transform="translate(57 0)" stroke="#E8E9EF"/><path d="M0 0 H18 Q26 0 26 8 V12 Q26 20 18 20 H0 M18 20 Q28 20 28 28 V32 Q28 40 20 40 H0 V0" transform="translate(94 0)" stroke="#E8E9EF"/><path d="M30 0 H8 Q0 0 0 8 V32 Q0 40 8 40 H30" transform="translate(133 0)" stroke="#E33255"/><path d="M0 0 V40 M28 0 V40 M0 20 H28" transform="translate(174 0)" stroke="#E33255"/><path d="M26 0 H0 V40 H26 M0 20 H21" transform="translate(213 0)" stroke="#E33255"/><path d="M0 40 V0 H18 Q26 0 26 8 V12 Q26 20 18 20 H0 M13 20 L28 40" transform="translate(250 0)" stroke="#E33255"/><path d="M0 40 V0 H18 Q26 0 26 8 V12 Q26 20 18 20 H0 M13 20 L28 40" transform="translate(289 0)" stroke="#E33255"/><path d="M0 0 L16 21 L32 0 M16 21 V40" transform="translate(328 0)" stroke="#E33255"/></g>
  <rect x="76" y="200" width="64" height="4" rx="2" fill="#E33255"/>
  <text x="76" y="244" fill="#E8E9EF" font-family="'Space Grotesk', 'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.5">SOFTWARE ENGINEERING · BACKEND · SYSTEMS</text>
  <text x="76" y="278" fill="#8A8C99" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15">&lt; build / learn / iterate /&gt;</text>

  <!-- Right: the Code Cherry mark -->
  <g transform="translate(830 40) scale(2.5)">
  <defs>
    <radialGradient id="banner-ball" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FF5575"/><stop offset=".6" stop-color="#E33255"/><stop offset="1" stop-color="#C8264A"/>
    </radialGradient>
    <radialGradient id="banner-halo"><stop offset="0" stop-color="#E33255" stop-opacity=".45"/><stop offset="1" stop-color="#E33255" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="50" cy="60" r="24" fill="url(#banner-halo)"/>
  <path d="M26 28 L8 50 L26 72" fill="none" stroke="#E33255" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 28 L92 50 L74 72" fill="none" stroke="#E33255" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M49 49 C49 38 53 29 61 22" fill="none" stroke="#FF5575" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M61 22 C66 17 74 17 78 21 C73 26 66 27 61 22 Z" fill="#FF5575"/>
  <circle cx="49" cy="61" r="14" fill="url(#banner-ball)"/>
  <path d="M41 55 A9 9 0 0 1 48 50" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
</g>
</svg>
